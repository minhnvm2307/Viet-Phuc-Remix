<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A6361E" />
      <stop offset="100%" stop-color="#732212" />
    </radialGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#8C2D19" stroke-width="3" stroke-dasharray="6,4" />
  <!-- Main Seal Circle -->
  <circle cx="100" cy="100" r="86" fill="url(#sealBg)" stroke="#D4AF37" stroke-width="2.5" />
  <!-- Inner Decorative Ring -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#FDFBF7" stroke-width="1.5" opacity="0.6" />
  <!-- Dong Son Cardinal Axis -->
  <line x1="100" y1="28" x2="100" y2="40" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="100" y1="160" x2="100" y2="172" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="28" y1="100" x2="40" y2="100" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="160" y1="100" x2="172" y2="100" stroke="#FDFBF7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <!-- Center Monogram -->
  <text x="100" y="116" font-family="'Cinzel', 'Times New Roman', 'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="#FDFBF7" text-anchor="middle" letter-spacing="4">VP</text>
  <!-- Subtext Arc -->
  <text x="100" y="146" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="3">REMIX</text>
</svg>
